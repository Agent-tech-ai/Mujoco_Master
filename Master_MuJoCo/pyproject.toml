[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "master-mujoco-local"
version = "0.1.0"
description = "Local MuJoCo simulator for the FF Master / AgiBot X2 Ultra"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.2,<4",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
include = ["master_sim*"]
